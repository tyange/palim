name: Deploy Palim to AWS (Nginx)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    # tyange-labs 조직 스코프에 `--label self-hosted`로 등록된 forgejo-runner에서 실행.
    # tyange-dev / tyange-blog 워크플로와 같은 패턴 — 매 job이 새 node:lts-bookworm
    # 컨테이너에서 돌므로 배포는 secrets.HOST(=127.0.0.1)로 SSH해 호스트에 쓴다.
    runs-on: self-hosted
    environment: deploy on aws

    steps:
      - name: Checkout
        uses: https://github.com/actions/checkout@v4

      - name: Setup Bun
        uses: https://github.com/oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate required deployment variables
        run: |
          test -n "${{ vars.DEPLOY_PATH }}" || (echo "Missing variable: DEPLOY_PATH" && exit 1)

      - name: Build
        run: bun run build

      - name: Upload build via SCP
        uses: https://github.com/appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          source: "dist"
          target: "${{ vars.DEPLOY_PATH }}/releases/${{ github.sha }}"
          strip_components: 0
          debug: true
          rm: true

      - name: Switch release and reload Nginx
        uses: https://github.com/appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          script: |
            set -e
            DEPLOY_PATH="${{ vars.DEPLOY_PATH }}"
            RELEASE_SHA="${{ github.sha }}"

            mkdir -p "$DEPLOY_PATH"
            cd "$DEPLOY_PATH"
            ln -sfn "releases/${RELEASE_SHA}/dist" current

            sudo nginx -t
            sudo systemctl reload nginx
